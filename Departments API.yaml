openapi: 3.0.3
info:
  title: Departments API
  version: 1.0.0
  description: API for departments and employees
paths:
  /api/departments/:
    post:
      operationId: departments_create
      description: Представление создания подразделения.
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCreate'
          description: ''
  /api/departments/{id}/:
    get:
      operationId: departments_retrieve
      description: |-
        Представление для работы с конкретным подразделением.

        GET, PATCH, DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTree'
          description: ''
    put:
      operationId: departments_update
      description: |-
        Представление для работы с конкретным подразделением.

        GET, PATCH, DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentTree'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentTree'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentTree'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentTree'
          description: ''
    patch:
      operationId: departments_partial_update
      description: |-
        Представление для работы с конкретным подразделением.

        GET, PATCH, DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentUpdate'
          description: ''
    delete:
      operationId: departments_destroy
      description: |-
        Представление для работы с конкретным подразделением.

        GET, PATCH, DELETE.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/departments/{id}/employees/:
    post:
      operationId: departments_employees_create
      description: Представление создания сотрудника.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreate'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
