components:
  schemas:
    DepartmentCreate:
      type: object
      description: Сериализатор для создания подразделений.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        parent_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - id
      - name
      - parent_id
    DepartmentTree:
      type: object
      description: Сериализатор вывода дерева подразделений до заданной глубины.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Подразделение
          maxLength: 200
        employees:
          type: array
          items:
            type: object
            additionalProperties: {}
          nullable: true
          description: Получает отсортированный список сотрудников.
          readOnly: true
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Рекурсивно собирает поддерево до указанной глубины depth.
          readOnly: true
      required:
      - children
      - employees
      - id
      - name
    DepartmentUpdate:
      type: object
      description: Сериализатор для обновления подразделений.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        parent_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - id
      - name
      - parent_id
    EmployeeCreate:
      type: object
      description: Сериализатор для создания сотрудников.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
        position:
          type: string
        department_id:
          type: integer
          readOnly: true
        hired_at:
          type: string
          format: date
          nullable: true
          title: Дата найма
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - department_id
      - full_name
      - id
      - position
    PatchedDepartmentUpdate:
      type: object
      description: Сериализатор для обновления подразделений.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        parent_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
